<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Advance Happy Birthday ❤️</title>
  <meta name="description" content="An advance happy birthday wish, just for you." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="screen screen--reveal">
  <!-- Floating particles + hearts -->
  <canvas id="particles" class="particles" aria-hidden="true"></canvas>

  <div class="orb orb--pink" aria-hidden="true"></div>
  <div class="orb orb--purple" aria-hidden="true"></div>

  <!-- Confetti canvas sits above particles but below content -->
  <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>

  <main class="reveal">
  <div class="reveal__card glass">
    <p class="reveal__eyebrow">a wish, in advance</p>

    <h1 id="revealHeadline" class="reveal__headline" aria-label="Advance Happy Birthday My Bujji Thalli ❤️">
      <span class="line">Advance Happy Birthday</span>

      <span class="line line--accent">
        My Bujji Thalli ❤️
      </span>
    </h1>

    <p id="revealSub" class="reveal__sub">
      Exactly {{ days_left }} days left until the world celebrates
      the cutest soul ever ✨
    </p>
  </div>

  <!-- Glowing pulsing countdown -->
  <section class="countdown" aria-live="polite">
    <div class="countdown__chip glass">
      <span id="daysLeft" class="countdown__num">{{ days_left }}</span>

      <span class="countdown__label">
        Days Left <span class="cake">🎂</span>
      </span>
    </div>
  </section>
</main>

    <!-- Glowing pulsing countdown -->
    <section class="countdown" aria-live="polite">
      <div class="countdown__chip glass">
        <span id="daysLeft" class="countdown__num">{{ days_left }}</span>
        <span class="countdown__label">Days Left <span class="cake">🎂</span></span>
      </div>
    </section>
  </main>

  <!-- Subtle music toggle. Works only if static/music/ambient.mp3 exists. -->
  <button id="musicToggle" class="music-toggle" type="button" aria-label="Toggle music">
    <span class="music-toggle__icon">♪</span>
  </button>

  <!-- Background music: silent if file is missing, no error shown to user -->
  <audio
    id="ambient"
    src="{{ url_for('static', filename='music/ambient.mp3') }}"
    loop
    preload="auto"
  ></audio>

  <!-- Reveal entrance curtain (fades away on load) -->
  <div id="curtain" class="curtain curtain--open" aria-hidden="true"></div>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  <script>
    BirthdaySurprise.initReveal({
      birthday: "{{ birthday_iso }}"
    });
  </script>
</body>
</html>
